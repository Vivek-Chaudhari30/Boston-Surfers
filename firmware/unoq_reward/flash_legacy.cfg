# Use modern connect-under-reset with the original 0.52.0 sketch address.
# Only use with a matching 0.52.0 loader and 0.52.0-compiled sketch.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
if {$::tcl_platform(platform) eq "windows"} {
  set null_device NUL
} else {
  set null_device /dev/null
}
init
reset halt
flash info 0
log_output $null_device
if {[catch {flash verify_image ${filename0}}] != 0} {
  log_output default
  flash write_image erase ${filename0}
}
log_output $null_device
if {[catch {flash verify_image ${filename1} 0x80F0000 bin}] != 0} {
  log_output default
  flash write_image erase ${filename1} 0x80F0000 bin
}
log_output default
reset halt
resume
sleep 100
mww 0xE000EDF0 0xA05F0000
shutdown
